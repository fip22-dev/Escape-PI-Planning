<!doctype html><html><head><title>Mobile rotation browser checks</title></head>
<body style="background:#eef2f2;font:16px system-ui"><h1>Mobile rotation browser checks</h1>
<p>Coarse pointer and missing Fullscreen API simulated; real Phaser canvas and DOM input.</p>
<ol id="results"></ol><iframe id="phone" src="./fixture.html" style="border:1px solid;width:844px;height:390px"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const results = document.querySelector('#results');
const wait = ms => new Promise(r => setTimeout(r, ms));
const until = async fn => { for(let i=0;i<100;i++){if(fn())return;await wait(80);}throw Error('Timed out'); };
const assert = (value, message) => { if(!value) throw Error(message); };
const pass = label => results.insertAdjacentHTML('beforeend', `<li>PASS: ${label}</li>`);
try {
 await until(()=>frame.contentWindow.__game?.scene.isActive('intro'));
 const win = frame.contentWindow, doc = frame.contentDocument, game = win.__game;
 const page = doc.querySelector('.page'), button = doc.querySelector('.fullscreen-button');
 const canvas = doc.querySelector('canvas');
 const fits = () => { const r=canvas.getBoundingClientRect(), p=page.getBoundingClientRect(); return r.left>=-1 && r.top>=-1 && r.right<=win.innerWidth+1 && r.bottom<=win.innerHeight+1 && (!page.classList.contains('is-mobile-landscape') || Math.max(Math.abs(r.width-p.width),Math.abs(r.height-p.height))<2); };
 const accessible = el => { const r=el.getBoundingClientRect(); return doc.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.closest('button')===el; };
 const point = (x,y) => { const r=canvas.getBoundingClientRect(), w=game.scale.width/4, u=(x+(w-320)/2)/w; return page.classList.contains('is-rotated') ? {x:r.right-y/240*r.width,y:r.top+u*r.height} : {x:r.left+u*r.width,y:r.top+y/240*r.height}; };
 const mouse = (type,x,y,buttons=0) => { const p=point(x,y); canvas.dispatchEvent(new win.MouseEvent(type,{bubbles:true,clientX:p.x,clientY:p.y,button:0,buttons})); };
 const tap = async (x,y) => { mouse('mousemove',x,y); await wait(80); mouse('mousedown',x,y,1); await wait(80); mouse('mouseup',x,y); await wait(250); };
 assert(!page.classList.contains('is-expanded'),'Landscape startup already expanded: first tap would shrink');
 await wait(250); const normalWidth=canvas.getBoundingClientRect().width;
 button.click(); await until(()=>page.classList.contains('is-expanded') && fits() && canvas.getBoundingClientRect().width>normalWidth+1);
 assert(!page.classList.contains('is-rotated'),'landscape rotated twice');
 assert(canvas.getBoundingClientRect().width>normalWidth+1,'landscape first tap did not enlarge canvas');
 button.click(); await until(()=>!page.classList.contains('is-expanded'));
 pass('Landscape cold start: first tap enlarges, second tap exits');
 frame.style.width='390px'; frame.style.height='844px'; await wait(250);
 assert(!page.classList.contains('is-rotated'),'normal portrait unexpectedly rotated');
 button.click();
 await until(()=>page.classList.contains('is-rotated') && fits());
 assert(Math.abs(canvas.clientWidth/page.clientWidth-1)<0.01 && Math.abs(canvas.clientHeight/page.clientHeight-1)<0.01,'canvas must fill the mobile stage');
 assert(accessible(button),'exit button unreachable'); await wait(300);
 pass('Portrait button rotates stage, fits canvas and preserves proportions');
 await tap(160,171);
 await until(()=>game.scene.getScene('intro').view==='help');
 mouse('mousedown',160,145,1); mouse('mousemove',160,95,1); mouse('mouseup',160,95);
 await until(()=>game.scene.getScene('intro').helpScroll>0);
 pass('Inverse-rotated menu hit testing and help dragging');
 await tap(160,194); await until(()=>game.scene.getScene('intro').view==='home'); await wait(150);
 await tap(160,151);
 await until(()=>game.scene.isActive('graybox'));
 await until(fits);
 for(const el of doc.querySelectorAll('.touch-controls button')) assert(accessible(el), `${el.textContent} unreachable`);
 doc.querySelector('[data-action="pause"]').click();
 await until(()=>game.scene.getScene('graybox').isPaused);
 assert(fits(),'paused canvas exceeds viewport');
 await tap(160,124);
 await until(()=>game.scene.isActive('intro'));
 pass('Rotated game start, all control hit regions, pause and canvas menu return');
 await tap(160,151); await until(()=>game.scene.isActive('graybox'));
 const scene=game.scene.getScene('graybox');
 frame.style.width='844px'; frame.style.height='390px';
 await until(()=>!page.classList.contains('is-rotated') && fits());
 assert(page.classList.contains('is-expanded'),'lost expanded view');
 assert(game.scene.getScene('graybox')===scene,'scene restarted');
 pass('Physical landscape removes CSS rotation without restarting');
 frame.style.width='390px'; frame.style.height='700px';
 await until(()=>page.classList.contains('is-rotated') && fits());
 doc.querySelector('[data-action="restart"]').click(); await wait(150);
 assert(scene.playerTile.x===34 && scene.playerTile.y===47,'restart did not reset player');
 button.click(); await until(()=>!page.classList.contains('is-expanded'));
 assert(!page.classList.contains('is-rotated'),'rotation remains after exit');
 pass('Portrait height changes, restart and return to normal view');
 frame.style.width='844px'; frame.style.height='390px';
 await wait(250); assert(!page.classList.contains('is-expanded'),'orientation entered expanded view without a tap');
 button.click(); await until(()=>page.classList.contains('is-expanded') && fits());
 button.click(); win.dispatchEvent(new win.Event('resize')); await wait(200);
 assert(!page.classList.contains('is-expanded'),'resize undid explicit exit');
 pass('Landscape entry and exit remain controlled by the button');
 frame.style.width='390px'; frame.style.height='844px'; await wait(150); button.click(); await until(()=>page.classList.contains('is-rotated') && fits());
 const selection=win.getSelection(), range=doc.createRange(); range.selectNodeContents(page); selection.removeAllRanges(); selection.addRange(range);
 await until(()=>selection.rangeCount===0);
 for (const el of [page,canvas,button,...doc.querySelectorAll('.touch-controls button')]) {
   assert(win.getComputedStyle(el).userSelect==='none','game surface can be selected');
 }
 const menuEvent=new win.Event('contextmenu',{bubbles:true,cancelable:true}); button.dispatchEvent(menuEvent);
 assert(menuEvent.defaultPrevented,'long press context menu allowed');
 pass('Game selection is cleared and selection/context menus are suppressed');
 frame.style.width='874px'; frame.style.height='292px';
 await until(()=>!page.classList.contains('is-rotated') && fits() && Math.abs(canvas.clientWidth-874)<2);
 assert(Math.abs(canvas.clientHeight-292)<2,'Safari-height canvas not fitted');
 assert(game.scale.width/game.scale.height>2.9,'game remains fixed at 4:3');
 for(const el of doc.querySelectorAll('.touch-controls button')) assert(accessible(el),'control outside the shortened visible viewport');
 doc.querySelector('[data-action="pause"]').click(); await until(()=>scene.isPaused);
 assert(Math.abs(scene.pausePanel.x-game.scale.width/8)<0.1,'pause dialog not centred in widescreen');
 await tap(160,124); await until(()=>game.scene.isActive('intro'));
 await tap(160,171); await until(()=>game.scene.getScene('intro').view==='help');
 await tap(160,194); await until(()=>game.scene.getScene('intro').view==='home');
 pass('874×292 Safari viewport fills both axes, with centred dialogs and correct menu hits');
 const vv=win.visualViewport;
 for (const [key,value] of Object.entries({width:850,height:272,offsetLeft:12,offsetTop:10})) Object.defineProperty(vv,key,{configurable:true,value});
 vv.dispatchEvent(new win.Event('resize'));
 await until(()=>{const r=canvas.getBoundingClientRect();return Math.abs(r.left-12)<2 && Math.abs(r.top-10)<2 && Math.abs(r.width-850)<2 && Math.abs(r.height-272)<2;});
 pass('Visible viewport offsets and Safari bar resizing keep the canvas inside the visible area');
 for(const key of ['width','height','offsetLeft','offsetTop']) delete vv[key];
 vv.dispatchEvent(new win.Event('resize')); await until(()=>Math.abs(canvas.getBoundingClientRect().width-874)<2);
 await tap(160,151); await until(()=>game.scene.isActive('graybox'));
 const talkingScene=game.scene.getScene('graybox'), speaker=talkingScene.neutralPeople[28];
 talkingScene.updateSearcherDetection=()=>false;
 talkingScene.tweens.killAll();
 for(const person of talkingScene.neutralPeople) person.nextMoveAt=Infinity;
 talkingScene.cameras.main.stopFollow(); talkingScene.cameras.main.centerOn(speaker.sprite.x,speaker.sprite.y-30);
 talkingScene.playerTile={...speaker.tile}; talkingScene.player.setPosition(speaker.sprite.x,speaker.sprite.y);
 talkingScene.neutralSpeech.active=[]; talkingScene.neutralSpeech.readyAt=talkingScene.time.now;
 for(let i=0;i<talkingScene.neutralPeople.length;i++) talkingScene.neutralSpeech.personReadyAt[i]=i===28?0:Infinity;
 await until(()=>talkingScene.neutralSpeech.active.some(b=>b.personIndex===28) && talkingScene.speechBubbles[28].text.visible);
 const speech=talkingScene.neutralSpeech.active.find(b=>b.personIndex===28), label=talkingScene.speechBubbles[28].text;
 const original={x:label.x,y:label.y,expiry:speech.expiresAt,text:speech.text};
 await new Promise(resolve=>talkingScene.tweens.add({targets:speaker.sprite,x:speaker.sprite.x+16,y:speaker.sprite.y+8,duration:400,onComplete:resolve}));
 await until(()=>Math.abs(speech.anchor.x-speaker.sprite.x)<0.01 && Math.abs(speech.anchor.y-(speaker.sprite.y-10))<0.01);
 assert(Math.abs(label.x-original.x-16)<1 && Math.abs(label.y-original.y-8)<1,'bubble did not follow rendered NPC');
 assert(speech.expiresAt===original.expiry && speech.text===original.text,'movement renewed the bubble');
 const step=new Promise(resolve=>talkingScene.tweens.add({targets:speaker.sprite,x:speaker.sprite.x+10,duration:400,onComplete:resolve}));
 await wait(80); talkingScene.pauseGame();
 const paused={x:speaker.sprite.x,labelX:label.x,anchorX:speech.anchor.x};
 await wait(200);
 assert(speaker.sprite.x===paused.x && label.x===paused.labelX && speech.anchor.x===paused.anchorX,'speech/NPC moved during pause');
 talkingScene.resumeGame(); await step;
 await until(()=>Math.abs(speech.anchor.x-speaker.sprite.x)<0.01);
 assert(speech.expiresAt>original.expiry,'pause did not preserve the remaining display time');
 await until(()=>talkingScene.neutralSpeech.active.length===0);
 doc.querySelector('[data-action="restart"]').click(); await wait(100);
 assert(talkingScene.neutralSpeech.active.length===0 && Object.keys(talkingScene.neutralSpeech.personReadyAt).length===0,'restart kept old speech');
 pass('Speech follows smooth NPC movement, freezes in pause, expires and resets correctly');
 document.title='PASS – mobile rotation browser checks';
 results.insertAdjacentHTML('afterend','<h2>All 11 browser checks passed</h2>');
} catch(error) { results.insertAdjacentHTML('beforeend',`<li style="color:red">FAIL: ${error.stack}</li>`); document.title='FAIL – mobile rotation browser checks'; }
</script></body></html>
