<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142124" />
    <title>Escape PI Planning – iPhone/Safari-Testdemo</title>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Ein kleines PI-Planning-Fluchtspiel</p>
        <h1>Escape PI Planning</h1>
        <p class="intro">Finde den Weg vom grossen PI-Raum zum Ausgang.</p>
      </header>
      <div class="game-toolbar" aria-label="Spielansicht">
        <span class="test-build-label">iPhone/Safari-Testdemo · Basis a199290</span>
        <span class="display-status" role="status" aria-live="polite"></span>
        <button type="button" class="fullscreen-button" aria-pressed="false" title="Vollbild umschalten (F)">Vollbild</button>
      </div>
      <section class="game-shell" aria-label="Spielbereich">
        <div id="game-container"></div>
      </section>
      <nav class="touch-controls" aria-label="Spielsteuerung">
        <div class="direction-pad" aria-label="Bewegen">
          <button type="button" data-direction="up" aria-label="Nach oben">▲</button>
          <button type="button" data-direction="left" aria-label="Nach links">◀</button>
          <button type="button" data-direction="down" aria-label="Nach unten">▼</button>
          <button type="button" data-direction="right" aria-label="Nach rechts">▶</button>
        </div>
        <div class="touch-actions">
          <button type="button" data-action="pause">Pause / Weiter</button>
          <button type="button" data-action="restart">Neustart</button>
        </div>
      </nav>
      <footer class="controls">
        <span>Richtungstaste halten zum Laufen · auch mit WASD oder Pfeiltasten</span>
        <span>Die Kamera folgt deiner Spielfigur.</span>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
